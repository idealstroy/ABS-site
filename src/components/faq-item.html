<div class="accordion-item">
  <h3 class="accordion-header">
    <button class="accordion-button {{collapsed}}" type="button" data-bs-toggle="collapse" data-bs-target="#{{id}}" aria-expanded="{{expanded}}" aria-controls="{{id}}">{{question}}</button>
  </h3>
  <div id="{{id}}" class="accordion-collapse collapse {{show}}" data-bs-parent="#{{parentId}}">
    <div class="accordion-body">{{answer}}</div>
  </div>
</div>
