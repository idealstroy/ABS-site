<section class="cta-section section-space" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta-panel">
      <div class="row align-items-center g-4">
        <div class="col-12 col-lg-8">
          <h2 id="cta-title" class="mb-3">{{title}}</h2>
          {{text}}
          <!-- TODO: Insert the approved CTA text for the corresponding commercial page. -->
        </div>
        <div class="col-12 col-lg-4 text-lg-end">
          <a class="btn btn-abs-primary" href="{{href}}">{{label}}</a>
        </div>
      </div>
    </div>
  </div>
</section>
