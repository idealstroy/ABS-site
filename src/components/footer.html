<footer class="site-footer" id="contacts">
  <div class="container py-5">
    <div class="row gy-4 align-items-start">
      <div class="col-12 col-lg-4">
        <img class="brand-logo" src="{{logo}}" width="190" height="67" alt="АБС" loading="lazy" />
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <nav aria-label="Навигация в подвале">
          <ul class="list-unstyled footer-links mb-0">{{navigation}}</ul>
        </nav>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <a class="footer-contact d-block" href="tel:{{phoneHref}}">{{phone}}</a>
        <a class="footer-contact d-block" href="mailto:{{email}}">{{email}}</a>
        <a class="footer-note d-inline-block mt-3" href="/politika-konfidencialnosti/">Политика обработки персональных данных</a>
      </div>
    </div>
    <div class="footer-bottom mt-5 pt-4">© АБС, {{year}}.</div>
  </div>
</footer>
