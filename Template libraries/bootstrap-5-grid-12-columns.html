<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap 5 Grid 12 Columns</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GdQqXtv5l0oQ2uBfS3W6kM"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: #f6f7fb;
      }

      .grid-box {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #0d6efd, #4da3ff);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(13, 110, 253, 0.18);
      }

      .grid-box.alt {
        background: linear-gradient(135deg, #212529, #495057);
      }
    </style>
  </head>
  <body>
    <main class="container py-5">
      <div class="mb-4">
        <h1 class="h3 mb-2">Bootstrap 5 сетка на 12 колонок</h1>
        <p class="text-muted mb-0">Готовая база для дальнейшей верстки сайта.</p>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12">
          <div class="grid-box">col-12</div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
          <div class="grid-box">col-6 / col-md-4</div>
        </div>
        <div class="col-6 col-md-4">
          <div class="grid-box alt">col-6 / col-md-4</div>
        </div>
        <div class="col-12 col-md-4">
          <div class="grid-box">col-12 / col-md-4</div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-lg-8">
          <div class="grid-box">col-12 / col-lg-8</div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="grid-box alt">col-12 / col-lg-4</div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
        <div class="col-1"><div class="grid-box">1</div></div>
        <div class="col-1"><div class="grid-box alt">1</div></div>
      </div>
    </main>
  </body>
</html>
