          - heading "Кадровый вопрос — управляемый процесс" [level=2] [ref=f7e39]
          - paragraph [ref=f7e40]: АБС помогает компаниям обеспечивать объекты квалифицированным персоналом и сохранять непрерывность производственных процессов.
          - paragraph [ref=f7e41]: Подбираем и проверяем специалистов, помогаем с подготовкой, оформлением и доставкой на объект, а затем сопровождаем сотрудника в период работы. Так кадровая задача становится понятной последовательностью действий, а не постоянным источником риска для команды на объекте.
          - complementary [ref=f7e42]: Мы не закрываем вакансии ради отчета. Сопоставляем человека с задачей, условиями и сроком выхода, чтобы заказчик мог планировать работу спокойно.
