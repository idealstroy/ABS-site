      - article [ref=e220]:
        - heading "ПТО Онлайн — цифровой ПТО" [level=3] [ref=e226]
        - paragraph [ref=e227]: "Облачная платформа для исполнительной документации на объекте: объекты, библиотека ИД, журналы, сметы и аналитика — всё в одном рабочем пространстве."
      - article [ref=e228]:
        - heading "Объекты и проекты" [level=3] [ref=e233]
        - paragraph [ref=e234]: Создавайте объекты и настраивайте реквизиты участников, формы журналов и договорные параметры. Команда объекта и роли определяют доступ и ответственность.
      - article [ref=e235]:
        - heading "Библиотека ИД и шаблоны" [level=3] [ref=e241]
        - paragraph [ref=e242]: "Единая библиотека ИД по объекту и шифрам: создавайте документы по шаблонам или добавляйте готовые файлы. Комментарии и выгрузка в Word/Excel — из карточки документа."
      - article [ref=e243]:
        - heading "Конструктор и реестры" [level=3] [ref=e248]
        - paragraph [ref=e249]: "Создавайте свои шаблоны актов и журналов: поля, переменные и печатные формы DOCX/Excel. Собирайте документы в реестры и контролируйте готовность комплекта."
      - generic [ref=e250]:
        - article [ref=e251]:
          - heading "Создание реестра ИД через ИИ" [level=3] [ref=e256]
          - paragraph [ref=e257]: Поручите ИИ сформировать реестр исполнительной документации на основе данных по объекту. Проверьте готовый реестр перед передачей заказчику, не собирая его вручную.
        - article [ref=e258]:
          - heading "Матрица дефицитов ИД" [level=3] [ref=e265]
          - paragraph [ref=e266]: Мониторьте недостающие документы по каждому шифру и этапу работ, чтобы вовремя закрывать дефициты в исполнительной документации
        - article [ref=e267]:
          - heading "Редактор исполнительных схем внутри ПО" [level=3] [ref=e271]
          - paragraph [ref=e272]: Редактируйте исполнительные схемы прямо в ПТО онлайн, не переключаясь между программами. Подготовьте схему для включения в комплект исполнительной документации.
      - article [ref=e273]:
        - heading "Автозаполнение документов" [level=3] [ref=e277]
        - paragraph [ref=e278]: Автозаполнение реквизитов из справочников и распознавание сканов/сертификатов. Подстановка работ из ведомости и голосовой ввод для больших текстов ускоряют оформление.
      - article [ref=e279]:
        - heading "Электронные журналы" [level=3] [ref=e285]
        - paragraph [ref=e286]: Электронные ОЖР и входной контроль по выбранным формам. Записи связаны с документами, доступна история изменений и выгрузка в Word/Excel.
      - article [ref=e287]:
        - heading "Сметы" [level=3] [ref=e292]
        - paragraph [ref=e293]: "Ведите сметы по объектам в едином цифровом пространстве: контролируйте состав работ, объёмы и актуальность расчётов."
      - article [ref=e294]:
        - heading "Статусы, сроки и замечания" [level=3] [ref=e298]
        - paragraph [ref=e299]: Статусы документов и сроки по шифрам помогают контролировать прогресс и просрочки. Замечания и обсуждения фиксируются в комментариях к документам и реестрам.
      - article [ref=e300]:
        - heading "Аналитика" [level=3] [ref=e305]
        - paragraph [ref=e306]: Экран контроля комплектности показывает готовность по шифрам и реестрам, счётчики статусов и динамику во времени. Реестры собирают пакет документов для проверки и сдачи.
      - article [ref=e307]:
        - heading "КС-2, КС-3, КС-6а" [level=3] [ref=e312]
        - paragraph [ref=e313]: Готовьте акты выполненных работ и справки о стоимости по данным проекта, чтобы быстрее согласовывать закрывающие документы.
      - article [ref=e314]:
        - heading "Ведомость работ" [level=3] [ref=e318]
        - paragraph [ref=e319]: Фиксируйте объёмы и виды работ в ведомости, чтобы использовать единые исходные данные в документах и сметах.
      - article [ref=e320]:
        - heading "Материалы" [level=3] [ref=e325]
        - paragraph [ref=e326]: Учитывайте материалы на объекте и связывайте их с работами, документами и подтверждающими сертификатами.
